[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand: Railway runs it without a shell, so "$PORT" would be passed
# to uvicorn literally. The Dockerfile CMD uses sh -c and expands it correctly.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
